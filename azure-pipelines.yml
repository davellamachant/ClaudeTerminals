# Release build for Claude Terminals: builds and code-signs the installer on the agent that holds the company's
# SafeNet code signing token, then creates a draft GitHub release with the installer attached. Publishing the draft
# (after checking its notes) is what makes the in-app updater offer it.
#
# Run by hand (Run pipeline) on main or on a version tag. On a tag, the tag must be v<Version> from
# ClaudeTerminals.csproj; the release is created for v<Version> either way. Untick "Create the GitHub release" for a
# trial run that only builds and signs, keeping the installer on the run (Artifacts).
#
# One-time setup in Azure DevOps:
#   - This pipeline, created from the GitHub repository (it reads this file).
#   - The GitHub service connection named in githubConnection below, with access to the repository and permitted
#     for this pipeline.
#   - A pipeline variable TimeStampServer (the same RFC 3161 server the NuGet signing uses).
# The agent needs the .NET 10 SDK, Node.js (npm), Inno Setup 6 and the Windows SDK's signtool.

# Releases are started by hand: no pushes, tags or pull requests start this pipeline.
trigger: none
pr: none

parameters:
  # Untick for a trial run: build and sign only, with the installer kept on the run (Artifacts), no GitHub release.
  - name: createRelease
    displayName: 'Create the GitHub release (draft)'
    type: boolean
    default: true

variables:
  githubConnection: 'davellamachant'         # the GitHub service connection (Project settings › Service connections)
  repository: 'davellamachant/ClaudeTerminals'

pool:
  name: 'SelfHostedPool'                     # the pool with the code signing agent (SafeNet token)

steps:
  - checkout: self
    clean: true

  - task: PowerShell@2
    displayName: 'Check the tag matches the version'
    inputs:
      pwsh: false   # Windows PowerShell: always on the agent
      targetType: inline
      script: |
        $version = ([xml](Get-Content src/ClaudeTerminals/ClaudeTerminals.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        $tag = '$(Build.SourceBranchName)'
        if ('$(Build.SourceBranch)' -like 'refs/tags/*' -and $tag -ne "v$version") {
          throw "Tag $tag doesn't match the project version $version."
        }
        Write-Host "##vso[task.setvariable variable=AppVersion]$version"
        Write-Host "Building Claude Terminals $version"

  # Tools the build needs, set up on the agent if they're missing (signtool comes with the Windows SDK, already there).
  - task: NodeTool@0
    displayName: 'Node.js (front-end libraries)'
    inputs:
      versionSpec: '22.x'

  - task: UseDotNet@2
    displayName: '.NET 10 SDK'
    inputs:
      packageType: sdk
      version: '10.x'

  - task: PowerShell@2
    displayName: 'Inno Setup 6'
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $found = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
        if ($found) { Write-Host "Inno Setup: $($found[0])"; return }
        # A fixed version, installed for the agent's account only (no admin needed). It must carry a valid signature
        # from Inno Setup's publisher, Pyrsys B.V.
        $setup = Join-Path $env:AGENT_TEMPDIRECTORY 'innosetup-6.7.3.exe'
        Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup -UseBasicParsing
        $sig = Get-AuthenticodeSignature $setup
        if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike 'CN=Pyrsys B.V.*') { throw "The Inno Setup download isn't signed by its publisher: $($sig.Status) $($sig.SignerCertificate.Subject)" }
        Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
        if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'Inno Setup did not install.' }
        Write-Host 'Inno Setup installed.'

  - task: PowerShell@2
    displayName: 'Build and sign'
    inputs:
      pwsh: false   # Windows PowerShell: always on the agent
      # Inline, with the server passed as an environment variable: Azure's argument validation rejects the quoted
      # value in an Arguments field ("Detected characters in arguments that may not be executed correctly").
      targetType: inline
      script: |
        # An undefined variable reaches the script as the literal text "$(TimeStampServer)".
        if (-not $env:TIMESTAMP_SERVER -or $env:TIMESTAMP_SERVER.StartsWith('$(')) {
          throw 'The pipeline variable TimeStampServer is not set (Edit > Variables): the RFC 3161 timestamp server used for signing.'
        }
        & ./publish.ps1 -Sign -TimestampServer $env:TIMESTAMP_SERVER
    env:
      TIMESTAMP_SERVER: $(TimeStampServer)

  - task: PublishPipelineArtifact@1
    displayName: 'Keep the signed installer on the run'
    inputs:
      targetPath: 'artifacts/ClaudeTerminals-Setup-$(AppVersion).exe'
      artifact: 'installer'

  # Left out of a trial run entirely, so trying the signing doesn't need the GitHub connection.
  - ${{ if parameters.createRelease }}:
    - task: GitHubRelease@1
      displayName: 'Create draft GitHub release'
      inputs:
        gitHubConnection: '${{ variables.githubConnection }}'   # resolved when the pipeline is compiled, as Azure requires
        repositoryName: '$(repository)'
        action: create
        target: '$(Build.SourceVersion)'
        tagSource: userSpecifiedTag
        tag: 'v$(AppVersion)'
        title: 'Claude Terminals $(AppVersion)'
        releaseNotesSource: inline
        releaseNotesInline: 'Release notes to follow.'
        assets: 'artifacts/ClaudeTerminals-Setup-$(AppVersion).exe'
        isDraft: true
        addChangeLog: false
